<!DOCTYPE html>
<html lang="zh" data-theme="leaf">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f6f0" />
  <title>DurioML</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // 在页面画出来之前先套用外观，避免闪一下别的颜色
    try {
      var t = localStorage.getItem("durioml_theme");
      if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "rainforest" : "leaf";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <!-- 顶部 -->
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M19.5 3.5C11 3.5 5 8.6 5 15.3c0 1.6.4 3 1 4.2L4 21.5l1.4 1.4 2-2c1.2.6 2.6 1 4.2 1C18.4 21.9 20.5 13 19.5 3.5Zm-7.9 16.4c-1.1 0-2.1-.2-3-.6l6.9-6.9-1.4-1.4-6.9 6.9c-.4-.9-.6-1.9-.6-3C6.6 10 11 5.6 17.6 5.2c.4 7.3-.9 14.7-6 14.7Z"/></svg>
        </span>
        <div>
          <h1>DurioML</h1>
          <p class="tagline" data-i18n="tagline"></p>
        </div>
      </div>
      <div class="top-actions">
        <button id="langChip" class="chip" type="button" aria-label="language"></button>
        <button id="settingsBtn" class="icon-btn" type="button" aria-label="settings">
          <svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm0 5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm8.4-2.6-.1-.9 1.7-1.4-2-3.4-2.1.8a7.6 7.6 0 0 0-1.5-.9L16 2.9h-4l-.4 2.2c-.5.2-1 .5-1.5.9l-2.1-.8-2 3.4 1.7 1.4-.1.9.1.9-1.7 1.4 2 3.4 2.1-.8c.5.4 1 .7 1.5.9l.4 2.2h4l.4-2.2c.5-.2 1-.5 1.5-.9l2.1.8 2-3.4-1.7-1.4.1-.9Zm-2.1 2.4.9.7-.8 1.3-1.1-.4-.6.5c-.5.4-1 .7-1.6.9l-.7.3-.2 1.2h-1.5l-.2-1.2-.7-.3c-.6-.2-1.1-.5-1.6-.9l-.6-.5-1.1.4-.8-1.3.9-.7-.1-.8V12l.1-.8-.9-.7.8-1.3 1.1.4.6-.5c.5-.4 1-.7 1.6-.9l.7-.3.2-1.2h1.5l.2 1.2.7.3c.6.2 1.1.5 1.6.9l.6.5 1.1-.4.8 1.3-.9.7.1.8v.8l-.1.8Z"/></svg>
        </button>
      </div>
    </header>

    <!-- 收集模式提示 -->
    <button id="modePill" class="mode-pill hidden" type="button">
      <span class="pulse" aria-hidden="true"></span><span id="modePillText"></span>
    </button>

    <main>
      <!-- 还没拍照时的介绍卡 -->
      <section id="hero" class="card hero">
        <div class="hero-art" aria-hidden="true">
          <svg viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="54" class="art-bg"/>
            <path class="art-leaf" d="M86 30C58 30 36 47 36 72c0 6 1.5 11 4 15l-7 7 4 4 7-7c4 2.5 9 4 15 4 25 0 34-30 27-65Z"/>
            <path class="art-vein" d="M44 88 78 46"/>
            <circle class="art-spot" cx="66" cy="62" r="4"/>
            <circle class="art-spot" cx="56" cy="74" r="3"/>
            <circle class="art-spot" cx="72" cy="50" r="2.5"/>
          </svg>
        </div>
        <h2 data-i18n="hero_title"></h2>
        <p class="muted" data-i18n="hero_sub"></p>
        <p id="scope" class="scope hidden"></p>
      </section>

      <!-- 照片预览 -->
      <section id="photoCard" class="card photo hidden">
        <img id="previewImg" alt="" />
        <div id="scanOverlay" class="scan hidden">
          <span class="scan-line" aria-hidden="true"></span>
          <span class="scan-label" data-i18n="status_detecting"></span>
        </div>
      </section>

      <p id="status" class="status"></p>

      <!-- 识别结果 -->
      <section id="results" class="card results hidden">
        <p class="eyebrow" data-i18n="results_title"></p>
        <div class="top-result">
          <div id="ring" class="ring"><span id="ringPct"></span></div>
          <div>
            <p class="top-label" data-i18n="top_label"></p>
            <p id="topName" class="top-name"></p>
          </div>
        </div>
        <ul id="resultList" class="rank-list"></ul>
        <p id="lowConfidence" class="callout hidden" data-i18n="low_confidence"></p>
      </section>

      <!-- 收集模式：选类别 -->
      <section id="collectBox" class="card collect hidden">
        <p class="eyebrow" data-i18n="collect_title"></p>
        <div id="labelGrid" class="label-grid"></div>
      </section>

      <p class="disclaimer" data-i18n="disclaimer"></p>
    </main>

    <!-- 底部固定的拍照按钮（单手好按） -->
    <div class="dock">
      <label class="shutter">
        <input type="file" id="fileInput" accept="image/*" capture="environment" hidden />
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.4 4 7.6 6H5a3 3 0 0 0-3 3v9a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3V9a3 3 0 0 0-3-3h-2.6l-1.8-2H9.4ZM12 9a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/></svg>
        <span data-i18n="pick"></span>
      </label>
      <label class="gallery-btn">
        <input type="file" id="galleryInput" accept="image/*" hidden />
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm0 2v9.6l3.5-3.5 3 3 4.5-4.5 3 3V6H5Zm3.5 1a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6Z"/></svg>
        <span data-i18n="pick_gallery"></span>
      </label>
    </div>
  </div>

  <!-- 设置（从底部滑出） -->
  <div id="sheet" class="sheet hidden" aria-hidden="true">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <h3 id="sheetTitle" data-i18n="settings_title"></h3>
        <button class="icon-btn small" type="button" data-close aria-label="close">
          <svg viewBox="0 0 24 24"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4 6.4 5Z"/></svg>
        </button>
      </div>

      <p class="field-label" data-i18n="settings_language"></p>
      <div id="langSeg" class="segmented">
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="ms">Melayu</button>
      </div>

      <p class="field-label" data-i18n="settings_theme"></p>
      <div id="themeGrid" class="theme-grid"></div>

      <p class="field-label" data-i18n="settings_collect"></p>
      <div class="list">
        <button id="collectToggle" class="list-item" type="button">
          <span class="li-icon"><svg viewBox="0 0 24 24"><path d="M5 4h9l5 5v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Zm8 1.5V10h4.5L13 5.5ZM11 12v3H8v2h3v3h2v-3h3v-2h-3v-3h-2Z"/></svg></span>
          <span class="li-text"><span id="collectToggleTitle" class="li-title"></span><span class="li-desc" data-i18n="collect_on_desc"></span></span>
        </button>
        <button id="nameBtn" class="list-item hidden" type="button">
          <span class="li-icon"><svg viewBox="0 0 24 24"><path d="M12 3a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Zm0 9c4.4 0 8 2.2 8 5v2H4v-2c0-2.8 3.6-5 8-5Zm0 2c-3.3 0-6 1.5-6 3h12c0-1.5-2.7-3-6-3Z"/></svg></span>
          <span class="li-text"><span class="li-title" data-i18n="name_change"></span><span id="nameDesc" class="li-desc"></span></span>
        </button>
        <button id="inviteBtn" class="list-item hidden" type="button">
          <span class="li-icon"><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3Zm2 2v4h4V5H5Zm8-2h8v8h-8V3Zm2 2v4h4V5h-4ZM3 13h8v8H3v-8Zm2 2v4h4v-4H5Zm8-2h2v2h-2v-2Zm2 2h2v2h-2v-2Zm2-2h2v2h-2v-2Zm2 2h2v2h-2v-2Zm-6 2h2v2h-2v-2Zm2 2h2v2h-2v-2Zm2-2h2v2h-2v-2Zm2 2h2v2h-2v-2Z"/></svg></span>
          <span class="li-text"><span class="li-title" data-i18n="invite"></span><span class="li-desc" data-i18n="invite_desc"></span></span>
        </button>
      </div>
    </div>
  </div>

  <!-- 对话框（密码、名字、QR code） -->
  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle"></h3>
      <p id="modalText" class="muted"></p>
      <div id="modalBody"></div>
      <form id="modalForm">
        <input id="modalInput" class="input hidden" autocomplete="off" />
        <div class="modal-actions">
          <button id="modalCancel" class="btn ghost" type="button"></button>
          <button id="modalOk" class="btn primary" type="submit"></button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
