<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1b5e20" />
  <title>DurioML</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="topbar">
      <h1>🌿 DurioML</h1>
      <!-- 语言切换：中文 / English / Bahasa Melayu -->
      <select id="langSelect" aria-label="language">
        <option value="zh">中文</option>
        <option value="en">EN</option>
        <option value="ms">BM</option>
      </select>
    </div>
    <p class="sub" data-i18n="subtitle"></p>
    <p class="scope" data-i18n="scope"></p>
  </header>

  <main>
    <!-- 拍照 / 选图 -->
    <label class="camera-btn" id="pickBtn">
      <span data-i18n="pick"></span>
      <input type="file" id="fileInput" accept="image/*" capture="environment" hidden />
    </label>

    <!-- 预览 -->
    <div id="preview" class="preview hidden">
      <img id="previewImg" alt="" />
    </div>

    <!-- 状态 -->
    <p id="status" class="status"></p>

    <!-- 结果 -->
    <section id="results" class="results hidden">
      <h2 data-i18n="results_title"></h2>
      <ul id="resultList"></ul>
      <p id="lowConfidence" class="warn hidden" data-i18n="low_confidence"></p>
    </section>
  </main>

  <footer>
    <p data-i18n="disclaimer"></p>
  </footer>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
